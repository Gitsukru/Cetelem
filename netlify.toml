[build]
  # Commande à exécuter avant déploiement
  # 1. Générer version.js avec hash Git
  # 2. Injecter variables d'environnement dans index.html
  command = "node generate-version.cjs && node inject-env.cjs"
  # Dossier à publier (racine du projet)
  publish = "."

[build.environment]
  # Version de Node.js
  NODE_VERSION = "18"

# Headers de sécurité pour PWA
[[headers]]
  for = "/*"
  [headers.values]
    # Cache les assets statiques
    Cache-Control = "public, max-age=31536000, immutable"
    # Sécurité
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service Worker - pas de cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML - cache court pour détecter mises à jour rapidement
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirections pour PWA (toutes les routes → index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
