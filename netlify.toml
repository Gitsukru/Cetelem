[build]
  # Commande à exécuter avant déploiement
  # 1. Générer version.js avec hash Git
  # 2. Injecter variables d'environnement dans index.html
  # 3. Ajouter cache-busting (versions) aux fichiers JS/CSS
  command = "node generate-version.cjs && node inject-env.cjs && node add-cache-busting.cjs"
  # Dossier à publier (racine du projet)
  publish = "."

[build.environment]
  # Version de Node.js
  NODE_VERSION = "18"

# Headers de sécurité pour PWA
# ⚠️ ORDRE IMPORTANT : Les règles spécifiques AVANT les règles générales

# Service Worker - JAMAIS de cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache"

# HTML - pas de cache pour détecter mises à jour
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache"

# JavaScript - cache court (1 heure) pour mise à jour rapide
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

# CSS - cache court (1 heure) pour mise à jour rapide
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

# JavaScript dans dossiers - cache court
[[headers]]
  for = "/admin/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/src/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Images et assets statiques - cache long (1 an)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manifest et autres fichiers PWA - cache court
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Règle par défaut pour tout le reste
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS - Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Prevent XSS attacks (legacy but still useful)
    X-XSS-Protection = "1; mode=block"
    # Permissions Policy - restrict sensitive features
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    # Cache modéré pour tout le reste
    Cache-Control = "public, max-age=86400, must-revalidate"

# Redirections pour PWA (toutes les routes → index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
