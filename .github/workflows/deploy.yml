name: Auto Deploy avec Version Git

  on:
    push:
      branches:
        - main

  permissions:
    contents: write
    pages: write
    id-token: write

  jobs:
    deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '18'

        - name: Générer version.js automatiquement
          run: |
            COMMIT_HASH=$(git rev-parse --short HEAD)
            COMMIT_DATE=$(git log -1 --format=%cd 
  --date=format:'%Y-%m-%d')
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1 | 
  sed "s/'/\\\\'/g")

            cat > version.js << EOF
            const APP_VERSION = {
                number: '${COMMIT_HASH}',
                date: '${COMMIT_DATE}',
                changelog: ['${COMMIT_MSG}']
            };
            if (typeof window !== 'undefined') {
                window.APP_VERSION = APP_VERSION;
            }
            if (typeof self !== 'undefined' && typeof window
  === 'undefined') {
                self.APP_VERSION = APP_VERSION;
            }
            EOF

            echo "✅ version.js généré"
            cat version.js

        - name: Déployer sur GitHub Pages
          uses: peaceiris/actions-gh-pages@v3
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./
            publish_branch: gh-pages
            exclude_assets: '.github,node_modules,.git'
