name: Auto Deploy avec Version Git

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generer version
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(date '+%Y-%m-%d')
          cat > version.js << 'ENDOFFILE'
          const APP_VERSION = {
              number: 'HASHPLACEHOLDER',
              date: 'DATEPLACEHOLDER',
              changelog: ['Mise a jour automatique']
          };
          if (typeof window !== 'undefined') {
              window.APP_VERSION = APP_VERSION;
          }
          if (typeof self !== 'undefined' && typeof window === 'undefined') {
              self.APP_VERSION = APP_VERSION;
          }
          ENDOFFILE
          sed -i "s/HASHPLACEHOLDER/$COMMIT_HASH/g" version.js
          sed -i "s/DATEPLACEHOLDER/$COMMIT_DATE/g" version.js
          echo "Version: $COMMIT_HASH"
          cat version.js

      - name: Deployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.github,node_modules,.git'
