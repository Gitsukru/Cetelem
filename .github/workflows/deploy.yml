name: Auto Deploy avec Version Git

  on:
    push:
      branches:
        - main

  permissions:
    contents: write
    pages: write
    id-token: write

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Générer version.js
          run: |
            COMMIT_HASH=$(git rev-parse --short HEAD)
            COMMIT_DATE=$(git log -1 --format=%cd 
  --date=format:'%Y-%m-%d')

            cat > version.js << 'EOF'
            const APP_VERSION = {
                number: 'HASH_PLACEHOLDER',
                date: 'DATE_PLACEHOLDER',
                changelog: ['Mise à jour automatique']
            };
            if (typeof window !== 'undefined') {
                window.APP_VERSION = APP_VERSION;
            }
            if (typeof self !== 'undefined' && typeof window
  === 'undefined') {
                self.APP_VERSION = APP_VERSION;
            }
            EOF

            sed -i "s/HASH_PLACEHOLDER/$COMMIT_HASH/g"
  version.js
            sed -i "s/DATE_PLACEHOLDER/$COMMIT_DATE/g"
  version.js

            echo "Version générée: $COMMIT_HASH"
            cat version.js

        - name: Déployer sur GitHub Pages
          uses: peaceiris/actions-gh-pages@v3
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./
            publish_branch: gh-pages
            exclude_assets: '.github,node_modules,.git'
