name: Tests & Sécurité

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =======================
  # Tests Unitaires
  # =======================
  test:
    name: Tests Unitaires & Couverture
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 📊 Run tests with coverage
        run: npm run test:coverage

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 💾 Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage/

  # =======================
  # Tests de Sécurité
  # =======================
  security:
    name: Audit de Sécurité
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🛡️ Run security tests
        run: npm test -- tests/security/

      - name: 📋 Check for known vulnerabilities
        run: npx audit-ci --moderate

  # =======================
  # Lint & Format Check
  # =======================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check for console.logs (production)
        run: |
          if grep -r "console\.log" script*.js src/ --exclude-dir=node_modules; then
            echo "❌ console.log trouvés dans le code!"
            exit 1
          fi
        continue-on-error: true

  # =======================
  # Build Test
  # =======================
  build:
    name: Test Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📏 Check build size
        run: |
          du -sh dist/
          echo "Build completed successfully!"

  # =======================
  # Notification du Statut
  # =======================
  status:
    name: Statut Final
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: always()

    steps:
      - name: ✅ All checks passed
        if: ${{ needs.test.result == 'success' && needs.security.result == 'success' && needs.build.result == 'success' }}
        run: |
          echo "✅ Tous les tests sont passés!"
          echo "✅ Audit de sécurité OK"
          echo "✅ Build réussi"

      - name: ❌ Some checks failed
        if: ${{ needs.test.result != 'success' || needs.security.result != 'success' || needs.build.result != 'success' }}
        run: |
          echo "❌ Certains tests ont échoué"
          exit 1
