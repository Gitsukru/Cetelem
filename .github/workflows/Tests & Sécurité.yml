name: Tests & Sécurité

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =======================
  # Tests Unitaires
  # =======================
  test:
    name: Tests Unitaires & Couverture
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 📊 Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: 💾 Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage/
        continue-on-error: true

  # =======================
  # Tests de Sécurité
  # =======================
  security:
    name: Audit de Sécurité
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 🛡️ Run security tests
          run: npm test -- tests/security/ --passWithNoTests || echo "Security tests not yet activated"
          continue-on-error: true

  # =======================
  # Code Quality (Non-bloquant pour l'instant)
  # =======================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check for console.logs (production)
        run: |
          echo "🔍 Recherche de console.log..."
          grep -r "console\.log" script*.js src/ --exclude-dir=node_modules || echo "✅ Aucun console.log trouvé"
        continue-on-error: true

  # =======================
  # Build Test
  # =======================
  build:
    name: Test Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📏 Check build size
        run: |
          du -sh dist/
          echo "✅ Build completed successfully!"

  # =======================
  # Notification du Statut
  # =======================
  status:
    name: Statut Final
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: ✅ Tests status
        run: |
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"

          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Tous les checks essentiels sont passés!"
            exit 0
          else
            echo "⚠️ Certains checks ont échoué"
            exit 1
          fi
